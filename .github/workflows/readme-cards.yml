name: README cards

on:
  schedule:
    - cron: "17 3 * * *" # every morning, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - "data/portrait.txt"
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools
        run: pip install "fonttools==4.55.0"

      - name: Fetch contribution calendar
        run: python scripts/fetch_contributions.py "${{ github.repository_owner }}"

      - name: Render README cards (hero, graph, activity, tiles, repos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/render_readme_cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "chore: refresh README cards"
            git push
          fi
